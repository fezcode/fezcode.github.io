<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="t d">
  <title id="t">P: easy to do</title>
  <desc id="d">Messy rocks on the left become rocks sorted from small to big on the right after a few steps.</desc>
  <rect width="800" height="340" rx="22" fill="#f4ead5"/>
  <g font-family="'Trebuchet MS', Verdana, sans-serif" font-weight="800" fill="#2b2118">
    <text x="40" y="58" font-size="30">P = UGG CAN <tspan fill="#4f7a3a">DO</tspan> IT FAST</text>
    <text x="150" y="300" font-size="20" text-anchor="middle">MESSY ROCKS</text>
    <text x="610" y="300" font-size="20" text-anchor="middle">SORTED. DONE.</text>
  </g>
  <!-- messy -->
  <g stroke="#2b2118" stroke-width="4" stroke-linejoin="round">
    <path d="M60 240 q8-34 38-30 q30 4 26 34 z" fill="#9a8f80"/>
    <path d="M140 240 q4-64 54-62 q50 2 42 62 z" fill="#7d7266"/>
    <path d="M70 180 q2-20 22-20 q20 0 18 20 z" fill="#b3a898"/>
    <path d="M170 160 q6-44 40-42 q34 2 30 42 z" fill="#8c8174"/>
    <path d="M232 240 q2-24 22-24 q20 0 18 24 z" fill="#a69b8c"/>
  </g>
  <!-- arrow -->
  <path d="M310 190 H460" stroke="#c8862a" stroke-width="10" stroke-linecap="round"/>
  <path d="M450 168 L486 190 L450 212 Z" fill="#c8862a"/>
  <text x="398" y="168" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="18" font-weight="700" fill="#2b2118" text-anchor="middle">few steps</text>
  <!-- sorted -->
  <g stroke="#2b2118" stroke-width="4" stroke-linejoin="round">
    <path d="M510 260 q2-20 18-20 q16 0 14 20 z" fill="#b3a898"/>
    <path d="M552 260 q2-28 22-28 q20 0 18 28 z" fill="#a69b8c"/>
    <path d="M600 260 q3-38 30-38 q27 0 24 38 z" fill="#9a8f80"/>
    <path d="M662 260 q4-50 38-50 q34 0 30 50 z" fill="#8c8174"/>
    <path d="M740 260 q2-62 22-62 q20 0 18 62 z" fill="#7d7266"/>
  </g>
  <path d="M500 262 H770" stroke="#2b2118" stroke-width="4" stroke-linecap="round"/>
</svg>
