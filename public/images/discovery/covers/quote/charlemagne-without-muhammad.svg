<svg xmlns="http://www.w3.org/2000/svg" width="640" height="880" viewBox="0 0 640 880" role="img" aria-labelledby="title desc"><title id="title">&quot;Without Islam, the Frankish Empire would probably never have existed and Charlemagne, without Mahomet, would be inconceivable.&quot; — discovery cover</title><desc id="desc">Original quote sleeve artwork for &quot;Without Islam, the Frankish Empire would probably never have existed and Charlemagne, without Mahomet, would be inconceivable.&quot;, Henri Pirenne.</desc><defs><pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#F0E8DB" /><circle cx="5" cy="4" r="0.5" fill="#3D2732" /></pattern><clipPath id="bounds"><rect x="0" y="0" width="640" height="880" fill="white" /></clipPath></defs><g clip-path="url(#bounds)"><rect x="0" y="0" width="640" height="880" fill="#3D2732" /><text x="44" y="52" font-family="Consolas, monospace" font-size="17" fill="#DFC0C5" letter-spacing="1">Quote</text><text x="596" y="52" font-family="Consolas, monospace" font-size="16" fill="#DFC0C5" text-anchor="end">2026</text><text x="20" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="340" fill="#9E7586" >“</text><path d="M44 144L596 144" fill="none" stroke="#9E7586" stroke-width="1" /><text x="44" y="356.2" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#F0E8DB" font-weight="400" letter-spacing="-1" font-style="italic">Without Islam, the</text><text x="44" y="404.5" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#F0E8DB" font-weight="400" letter-spacing="-1" font-style="italic">Frankish Empire</text><text x="44" y="452.8" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#F0E8DB" font-weight="400" letter-spacing="-1" font-style="italic">would probably never</text><text x="44" y="501.1" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#F0E8DB" font-weight="400" letter-spacing="-1" font-style="italic">have existed and</text><text x="44" y="549.4" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#F0E8DB" font-weight="400" letter-spacing="-1" font-style="italic">Charlemagne, without</text><text x="44" y="597.7" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#F0E8DB" font-weight="400" letter-spacing="-1" font-style="italic">Mahomet, would be</text><text x="44" y="646" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#F0E8DB" font-weight="400" letter-spacing="-1" font-style="italic">inconceivable.</text><path d="M44 707L122 707" fill="none" stroke="#DFC0C5" stroke-width="3" /><text x="44" y="754" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#DFC0C5" >Henri Pirenne</text><rect x="0" y="0" width="640" height="880" fill="url(#grain)" opacity="0.08"/></g></svg>
