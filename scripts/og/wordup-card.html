<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Wordup — OG preview</title>
    <link rel="stylesheet" href="/scripts/og/wordup-card.css" />
  </head>
  <body>
    <main class="card" id="card">
      <header class="masthead">
        <div class="brand">
          <svg viewBox="0 0 36 36" aria-hidden="true">
            <path
              d="M8 10c0-4 8-5 10 0l8 16c2 4 8 1 6-3L22 5c-2-4-8-3-8 1v23c0 4-8 4-8 0V15c0-5 8-5 8 0"
            />
          </svg>
          <span>wordup<span class="brand-dot">.</span></span>
        </div>
        <span id="header-note">Language is still becoming.</span>
      </header>
      <section class="copy">
        <div id="word-meta" class="word-meta"></div>
        <h1 id="title"></h1>
        <p id="meaning" class="meaning"></p>
        <div id="collection" class="collection"></div>
      </section>
      <div class="sculpture" aria-hidden="true">
        <div class="halo"></div>
        <div class="shadow"></div>
        <canvas id="sculpture"></canvas>
      </div>
      <footer>
        <span id="footer-note">Entirely invented. Open to interpretation.</span>
        <span id="page-url">fezcode.com/wordup</span>
      </footer>
    </main>
    <script type="module" src="/scripts/og/wordup-card.js"></script>
  </body>
</html>
