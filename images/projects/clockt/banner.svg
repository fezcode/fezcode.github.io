<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400"
     role="img" aria-label="clockt — a terminal emulator and multiplexer for Windows">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#a5b4ff"/>
      <stop offset="0.5" stop-color="#ff9ec7"/>
      <stop offset="1"   stop-color="#63f5a6"/>
    </linearGradient>
    <radialGradient id="vignette" cx="30%" cy="55%" r="70%">
      <stop offset="0" stop-color="#1c1f38"/>
      <stop offset="1" stop-color="#0f1120"/>
    </radialGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5b4ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a5b4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181a29"/>
      <stop offset="1" stop-color="#15172a"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#vignette)"/>

  <!-- mark -->
  <g transform="translate(88 136)">
    <rect width="128" height="128" rx="24" fill="#15172a" stroke="#2a2c46"/>
    <rect x="25" y="39" width="46" height="14" rx="7" fill="url(#brand)" transform="rotate(45 48 46)"/>
    <rect x="25" y="75" width="46" height="14" rx="7" fill="url(#brand)" transform="rotate(-45 48 82)"/>
    <rect x="78" y="76" width="26" height="13" rx="4" fill="url(#brand)"/>
  </g>

  <!-- wordmark -->
  <text x="248" y="214" font-family="Geist, Inter, 'Segoe UI', sans-serif" font-size="112" font-weight="700" letter-spacing="-4" fill="url(#brand)">clockt</text>
  <text x="252" y="262" font-family="'Geist Mono', 'JetBrains Mono', Consolas, monospace" font-size="22" fill="#9aa0c0">terminal emulator &amp; multiplexer for Windows</text>

  <!-- window sketch -->
  <g transform="translate(760 62)">
    <rect x="0" y="0" width="450" height="276" rx="14" fill="url(#chrome)" stroke="#23253f"/>
    <rect x="0" y="0" width="450" height="60" fill="url(#glow)" rx="14"/>
    <!-- tabs -->
    <rect x="14" y="12" width="92" height="24" rx="12" fill="#ffffff" fill-opacity="0.10"/>
    <circle cx="28" cy="24" r="4" fill="#5b6ee8"/>
    <rect x="40" y="20" width="52" height="8" rx="4" fill="#e8e6ff" fill-opacity="0.85"/>
    <rect x="114" y="12" width="80" height="24" rx="12" fill="#ffffff" fill-opacity="0.04"/>
    <circle cx="128" cy="24" r="4" fill="#63f5a6"/>
    <rect x="140" y="20" width="44" height="8" rx="4" fill="#9aa0c0" fill-opacity="0.7"/>
    <rect x="202" y="12" width="24" height="24" rx="12" fill="#ffffff" fill-opacity="0.04"/>
    <rect x="210" y="23" width="8" height="2" fill="#9aa0c0"/>
    <rect x="213" y="20" width="2" height="8" fill="#9aa0c0"/>
    <!-- two panes -->
    <rect x="14" y="48" width="208" height="186" rx="10" fill="#15172a" stroke="#a5b4ff"/>
    <rect x="228" y="48" width="208" height="186" rx="10" fill="#15172a" stroke="#23253f"/>
    <!-- left pane text -->
    <text x="26" y="72" font-family="'Geist Mono', 'JetBrains Mono', Consolas, monospace" font-size="12" fill="#a5b4ff">❯</text>
    <text x="40" y="72" font-family="'Geist Mono', 'JetBrains Mono', Consolas, monospace" font-size="12" fill="#e8e6ff">clockt new -n build</text>
    <rect x="26" y="82" width="150" height="6" rx="3" fill="#63f5a6" fill-opacity="0.8"/>
    <rect x="26" y="94" width="110" height="6" rx="3" fill="#ffd083" fill-opacity="0.8"/>
    <rect x="26" y="106" width="170" height="6" rx="3" fill="#7ee0ff" fill-opacity="0.7"/>
    <rect x="26" y="118" width="80" height="6" rx="3" fill="#ff9ec7" fill-opacity="0.8"/>
    <rect x="26" y="136" width="9" height="14" fill="#a5b4ff"/>
    <!-- right pane text -->
    <text x="240" y="72" font-family="'Geist Mono', 'JetBrains Mono', Consolas, monospace" font-size="12" fill="#a5b4ff">❯</text>
    <text x="254" y="72" font-family="'Geist Mono', 'JetBrains Mono', Consolas, monospace" font-size="12" fill="#9aa0c0">clockt ls</text>
    <rect x="240" y="82" width="120" height="6" rx="3" fill="#d5d9f2" fill-opacity="0.5"/>
    <rect x="240" y="94" width="160" height="6" rx="3" fill="#d5d9f2" fill-opacity="0.5"/>
    <rect x="240" y="106" width="140" height="6" rx="3" fill="#d5d9f2" fill-opacity="0.5"/>
    <!-- status bar -->
    <rect x="0" y="246" width="450" height="30" rx="0" fill="#ffffff" fill-opacity="0.03"/>
    <line x1="0" y1="246" x2="450" y2="246" stroke="#2a2c46"/>
    <rect x="14" y="254" width="60" height="14" rx="7" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="82" y="254" width="96" height="14" rx="7" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="186" y="254" width="70" height="14" rx="7" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="366" y="254" width="70" height="14" rx="7" fill="#ffffff" fill-opacity="0.06"/>
  </g>
</svg>
