<svg xmlns="http://www.w3.org/2000/svg" width="640" height="880" viewBox="0 0 640 880" role="img" aria-labelledby="title desc"><title id="title">&quot;If everything seems under control, you're not going fast enough.&quot; — discovery cover</title><desc id="desc">Original quote sleeve artwork for &quot;If everything seems under control, you're not going fast enough.&quot;, Mario Andretti.</desc><defs><pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#F0E8DB" /><circle cx="5" cy="4" r="0.5" fill="#3D2732" /></pattern><clipPath id="bounds"><rect x="0" y="0" width="640" height="880" fill="white" /></clipPath></defs><g clip-path="url(#bounds)"><rect x="0" y="0" width="640" height="880" fill="#3D2732" /><text x="44" y="52" font-family="Consolas, monospace" font-size="17" fill="#DFC0C5" letter-spacing="1">Quote</text><text x="596" y="52" font-family="Consolas, monospace" font-size="16" fill="#DFC0C5" text-anchor="end">2026</text><text x="20" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="340" fill="#9E7586" >“</text><path d="M44 144L596 144" fill="none" stroke="#9E7586" stroke-width="1" /><text x="44" y="488.5" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#F0E8DB" font-weight="400" letter-spacing="-1" font-style="italic">If everything seems</text><text x="44" y="541" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#F0E8DB" font-weight="400" letter-spacing="-1" font-style="italic">under control,</text><text x="44" y="593.5" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#F0E8DB" font-weight="400" letter-spacing="-1" font-style="italic">you're not going</text><text x="44" y="646" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#F0E8DB" font-weight="400" letter-spacing="-1" font-style="italic">fast enough.</text><path d="M44 707L122 707" fill="none" stroke="#DFC0C5" stroke-width="3" /><text x="44" y="754" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#DFC0C5" >Mario Andretti</text><rect x="0" y="0" width="640" height="880" fill="url(#grain)" opacity="0.08"/></g></svg>
