<svg xmlns="http://www.w3.org/2000/svg" width="640" height="760" viewBox="0 0 640 760" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Why the knife stays in the kitchen</title>
  <desc id="description">A five-step flow: Shared tray, no personal plate leads to nothing to cut on, so food must arrive bite-sized. Diners use a spoon, bread, and their hand. The knife stays in the kitchen.</desc>
  <defs>
    <linearGradient id="slate" x1="0" y1="0" x2="640" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D333D"/>
      <stop offset="1" stop-color="#101E25"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF4F5"/>
      <stop offset="0.5" stop-color="#A6BCC5"/>
      <stop offset="1" stop-color="#DCE7EB"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="m2 2 3 3-3 3" stroke="#9BB0B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="640" height="760" rx="24" fill="url(#slate)"/>
  <rect x="0.75" y="0.75" width="638.5" height="758.5" rx="23.25" stroke="#46606A" stroke-opacity="0.7" stroke-width="1.5"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="40" y="52" fill="#EDF2F3" font-size="30" font-weight="600" letter-spacing="-0.6">The logic of a shared meal</text>
    <text x="40" y="82" fill="#AABDC4" font-size="20">From the sini to the kitchen</text>
    <path d="M40 106H600" stroke="#46606A" stroke-opacity="0.7"/>

    <!-- The continuous spine makes the causal order explicit. -->
    <g stroke="#69848F" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M88 205V226"/>
      <path d="M88 315V336"/>
      <path d="M88 425V446"/>
      <path d="M88 535V566"/>
    </g>

    <!-- A sini seen from above, with bowls shared around the centre. -->
    <g transform="translate(88 164)" stroke-linecap="round" stroke-linejoin="round">
      <circle r="39" fill="#233D48" stroke="#587681"/>
      <circle r="28" stroke="#D5A56C" stroke-width="1.8"/>
      <circle r="23" stroke="#D5A56C" stroke-opacity="0.35"/>
      <circle cx="0" cy="-10" r="7" fill="#D5A56C" fill-opacity="0.15" stroke="#D5A56C" stroke-width="1.6"/>
      <circle cx="-10" cy="8" r="7" fill="#D5A56C" fill-opacity="0.15" stroke="#D5A56C" stroke-width="1.6"/>
      <circle cx="10" cy="8" r="7" fill="#D5A56C" fill-opacity="0.15" stroke="#D5A56C" stroke-width="1.6"/>
      <path d="M-35 0h3M32 0h3" stroke="#D5A56C" stroke-width="2"/>
    </g>
    <text x="156" y="156" fill="#EDF2F3" font-size="29" font-weight="600">Shared tray,</text>
    <text x="156" y="191" fill="#B5C6CD" font-size="27">no personal plate</text>

    <!-- A missing individual cutting surface. -->
    <g transform="translate(88 274)" stroke-linecap="round" stroke-linejoin="round">
      <circle r="39" fill="#1C333E" stroke="#46606A"/>
      <circle r="23" stroke="#8FA9B4" stroke-width="1.8" stroke-dasharray="3 5"/>
      <circle r="16" stroke="#8FA9B4" stroke-opacity="0.4" stroke-width="1.5"/>
      <path d="m-24 24 48-48" stroke="#1C333E" stroke-width="10"/>
      <path d="m-24 24 48-48" stroke="#D5A56C" stroke-width="2.2"/>
    </g>
    <text x="156" y="284" fill="#EDF2F3" font-size="29" font-weight="600">Nothing to cut on</text>

    <!-- Small pieces, already prepared before reaching the table. -->
    <g transform="translate(88 384)" stroke="#D5A56C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle r="39" fill="#1C333E" stroke="#46606A" stroke-width="1"/>
      <path d="m-22-13 10-5 11 5-10 6Zm0 0v12l11 6V-7m10-6v12l-10 6" fill="#D5A56C" fill-opacity="0.1"/>
      <path d="m5-5 10-5 11 5-10 6Zm0 0V7l11 6V1m10-6V7l-10 6" fill="#D5A56C" fill-opacity="0.1"/>
      <path d="m-15 13 8-4 9 4-8 5Zm0 0v9l9 5v-9m8-5v9l-8 5" fill="#D5A56C" fill-opacity="0.1"/>
    </g>
    <text x="156" y="376" fill="#EDF2F3" font-size="29" font-weight="600">Food must arrive</text>
    <text x="156" y="411" fill="#DDB481" font-size="29" font-weight="600">bite-sized</text>

    <!-- A spoon and a torn piece of bread: tools for the shared meal. -->
    <g transform="translate(88 494)" stroke-linecap="round" stroke-linejoin="round">
      <circle r="39" fill="#1C333E" stroke="#46606A"/>
      <g transform="rotate(24 -12 0)" stroke="#D6E3E8" stroke-width="2">
        <ellipse cx="-12" cy="-13" rx="6.5" ry="10"/>
        <path d="M-12-3v25"/>
      </g>
      <path d="M4 20C-1 9 0-5 8-15c3-4 8-5 12-2l-1 6 6 1-3 7 5 4c-2 10-11 18-23 19Z" fill="#D5A56C" fill-opacity="0.12" stroke="#D5A56C" stroke-width="1.8"/>
      <path d="m7 6 4-6m1 12 5-6" stroke="#D5A56C" stroke-width="1.5"/>
    </g>
    <text x="156" y="504" fill="#EDF2F3" font-size="29" font-weight="600">Spoon, bread, hand</text>

    <!-- The conclusion is the only enclosed panel. The knife rests on a board. -->
    <rect x="32" y="584" width="576" height="144" rx="16" fill="#263C43" stroke="#D5A56C" stroke-opacity="0.65"/>
    <path d="M156 608V704" stroke="#D5A56C" stroke-opacity="0.25"/>
    <g transform="translate(94 656) rotate(-32)">
      <rect x="-43" y="-34" width="86" height="68" rx="13" fill="#182E36" stroke="#77909A" stroke-opacity="0.5"/>
      <path d="M-30-22H30M-30 22H30" stroke="#77909A" stroke-opacity="0.15"/>
      <path d="M-32-13H7V11H-10c-12 0-22-10-22-24Z" fill="url(#steel)"/>
      <path d="M-10 8H7" stroke="#F5FAFB" stroke-opacity="0.8"/>
      <rect x="7" y="-13" width="30" height="13" rx="4" fill="#D5A56C"/>
      <path d="M8-13V0" stroke="#101E25" stroke-width="2"/>
      <circle cx="17" cy="-6.5" r="1.5" fill="#344850"/>
      <circle cx="28" cy="-6.5" r="1.5" fill="#344850"/>
    </g>
    <text x="180" y="645" fill="#EDF2F3" font-size="30" font-weight="600" letter-spacing="-0.4">The knife stays</text>
    <text x="180" y="683" fill="#E2BA88" font-size="30" font-weight="600" letter-spacing="-0.4">in the kitchen</text>
  </g>
</svg>
