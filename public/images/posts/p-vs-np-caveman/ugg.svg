<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d">
  <title id="t">Ugg and the stone tablet</title>
  <desc id="d">A caveman named Ugg holds a club next to a stone tablet that reads EASY CHECK and EASY DO with a question mark.</desc>
  <rect width="800" height="380" rx="22" fill="#f4ead5"/>
  <path d="M0 300 Q200 280 400 300 T800 296 V380 H0Z" fill="#e2d2ad"/>
  <!-- sun -->
  <circle cx="700" cy="70" r="34" fill="#f2b33d"/>
  <g stroke="#f2b33d" stroke-width="5" stroke-linecap="round">
    <line x1="700" y1="18" x2="700" y2="4"/><line x1="752" y1="70" x2="768" y2="70"/>
    <line x1="737" y1="33" x2="748" y2="22"/><line x1="737" y1="107" x2="748" y2="118"/>
  </g>
  <!-- Ugg -->
  <g stroke="#2b2118" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="200" y1="185" x2="200" y2="262"/>
    <line x1="200" y1="262" x2="172" y2="318"/><line x1="200" y1="262" x2="228" y2="318"/>
    <line x1="200" y1="205" x2="160" y2="240"/><line x1="200" y1="205" x2="250" y2="190"/>
  </g>
  <path d="M168 248 L168 244 L178 300 L196 304 L206 248 Z" fill="#a8672b" stroke="#2b2118" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="200" cy="150" r="34" fill="#e9b98a" stroke="#2b2118" stroke-width="5"/>
  <path d="M168 138 Q172 108 200 112 Q232 108 234 140 Q222 124 200 128 Q180 124 168 138Z" fill="#5a3a22"/>
  <circle cx="189" cy="150" r="4" fill="#2b2118"/><circle cx="213" cy="150" r="4" fill="#2b2118"/>
  <path d="M188 168 Q200 176 212 168" stroke="#2b2118" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- club -->
  <g transform="rotate(32 254 196)">
    <rect x="248" y="120" width="12" height="78" rx="6" fill="#8a5a2b" stroke="#2b2118" stroke-width="4"/>
    <ellipse cx="254" cy="112" rx="22" ry="30" fill="#8a5a2b" stroke="#2b2118" stroke-width="4"/>
  </g>
  <!-- tablet -->
  <path d="M360 70 Q350 60 372 56 L640 52 Q664 52 662 74 L668 270 Q670 292 646 292 L378 296 Q354 296 356 272 Z" fill="#b9b2a4" stroke="#2b2118" stroke-width="5"/>
  <g font-family="'Trebuchet MS', Verdana, sans-serif" font-weight="800" fill="#2b2118" text-anchor="middle">
    <text x="512" y="132" font-size="40">EASY CHECK</text>
    <text x="512" y="190" font-size="40">=</text>
    <text x="512" y="250" font-size="40">EASY DO ?</text>
  </g>
  <g stroke="#2b2118" stroke-width="3" opacity=".35">
    <line x1="392" y1="94" x2="420" y2="98"/><line x1="610" y1="270" x2="636" y2="266"/>
  </g>
  <text x="200" y="356" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="22" font-weight="700" fill="#2b2118" text-anchor="middle">UGG</text>
</svg>
