<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="t d">
  <title id="t">The checker machine</title>
  <desc id="d">A problem and a proof stone, called a certificate, go into a checker machine. The machine says YES or NO in a polynomial number of steps.</desc>
  <rect width="800" height="340" rx="22" fill="#f4ead5"/>
  <text x="40" y="54" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="28" font-weight="800" fill="#2b2118">NP = THERE IS A FAST CHECKER</text>
  <g font-family="'Trebuchet MS', Verdana, sans-serif" font-weight="800" text-anchor="middle">
    <!-- problem -->
    <rect x="40" y="96" width="170" height="78" rx="14" fill="#e8dcc0" stroke="#2b2118" stroke-width="4"/>
    <text x="125" y="130" font-size="20" fill="#2b2118">PROBLEM</text>
    <text x="125" y="156" font-size="14" fill="#2b2118" font-weight="700">"rocks make 15?"</text>
    <!-- certificate -->
    <path d="M44 214 Q40 198 60 198 L196 196 Q214 196 212 214 L214 262 Q216 280 196 280 L62 282 Q42 282 44 264 Z" fill="#b9b2a4" stroke="#2b2118" stroke-width="4"/>
    <text x="128" y="234" font-size="18" fill="#2b2118">PROOF STONE</text>
    <text x="128" y="262" font-size="15" fill="#2b2118" font-weight="700">"use 7 and 8"</text>
  </g>
  <g stroke="#c8862a" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M216 136 Q270 136 300 180"/><path d="M218 240 Q270 240 300 204"/>
  </g>
  <!-- machine -->
  <rect x="300" y="110" width="220" height="170" rx="18" fill="#6d6357" stroke="#2b2118" stroke-width="5"/>
  <circle cx="350" cy="160" r="16" fill="#f2b33d" stroke="#2b2118" stroke-width="3"/>
  <circle cx="410" cy="160" r="16" fill="#c8862a" stroke="#2b2118" stroke-width="3"/>
  <g stroke="#2b2118" stroke-width="3"><line x1="334" y1="210" x2="486" y2="210"/><line x1="334" y1="232" x2="460" y2="232"/></g>
  <text x="410" y="266" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="16" font-weight="800" fill="#f4ead5" text-anchor="middle">CHECKER</text>
  <path d="M524 195 H600" stroke="#4f7a3a" stroke-width="8" stroke-linecap="round"/>
  <path d="M592 177 L620 195 L592 213 Z" fill="#4f7a3a"/>
  <g font-family="'Trebuchet MS', Verdana, sans-serif" font-weight="800" text-anchor="middle">
    <rect x="626" y="150" width="140" height="90" rx="16" fill="#cfe0b8" stroke="#4f7a3a" stroke-width="5"/>
    <text x="696" y="190" font-size="30" fill="#4f7a3a">YES</text>
    <text x="696" y="220" font-size="15" fill="#2b2118" font-weight="700">or NO</text>
    <text x="410" y="314" font-size="18" fill="#2b2118">checking takes polynomial steps (n, n², n³...)</text>
  </g>
</svg>
